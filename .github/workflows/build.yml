name: 🚀 Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装 Node.js 环境（并启用 npm cache）
      - name: Setup Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 2.1 显示版本，便于排查
      - name: Show node & npm versions
        run: |
          node -v
          npm -v

      # 2.2 可选：当你怀疑 npm v10 导致网络/并发问题时，可启用此步回退到 npm@9
      # - name: Optional: pin npm to v9 (uncomment to enable)
      #   run: npm install -g npm@9

      # 3. 安装依赖（增加 npm 重试/超时设置 + 重试循环）
      - name: Install dependencies
        env:
          # 增强 npm 的重试与超时设置（可按需调整）
          NPM_CONFIG_FETCH_RETRIES: 5
          NPM_CONFIG_FETCH_RETRY_FACTOR: 10
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 10000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 60000
          NPM_CONFIG_FETCH_TIMEOUT: 300000
        run: |
          set -euo pipefail
          MAX_TRIES=3
          try=0
          until [ $try -ge $MAX_TRIES ]
          do
            try=$((try+1))
            echo "npm ci try #$try"
            # --prefer-offline 尝试使用本地缓存以减少网络请求
            # --no-audit/--no-fund 可缩短安装时间
            if npm ci --prefer-offline --no-audit --no-fund; then
              echo "npm ci succeeded on attempt #$try"
              break
            fi
            echo "npm ci failed (attempt $try)"
            # 指数回退短暂停顿
            sleep_seconds=$(( try * 5 ))
            echo "sleeping ${sleep_seconds}s before next attempt..."
            sleep ${sleep_seconds}
          done

          if [ $try -ge $MAX_TRIES ]; then
            echo "npm ci failed after $MAX_TRIES attempts — dumping npm logs for diagnosis"
            # 打印日志以便 Actions 日志里能看到（上传 artifact 的步骤也会收集这些文件）
            ls -la /home/runner/.npm/_logs || true
            cat /home/runner/.npm/_logs/*.log || true
            exit 1
          fi

      # 3.1 如果步骤失败，这一步会触发并上传 npm 日志（便于离线分析）
      - name: Upload npm logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: /home/runner/.npm/_logs/**

      # 4. 运行构建
      - name: Build static files
        run: npm run build

      # 5. 推送到 gh-pages 分支
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # publish_branch: docs  # 如果想发布到 docs 分支，解除注释并改名
